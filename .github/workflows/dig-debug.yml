name: dig-debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Exercise the real code path
        run: |
          python3 - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("dns_doctor", "infra/dns_doctor.py")
          m = importlib.util.module_from_spec(spec)
          sys.modules["dns_doctor"] = m
          spec.loader.exec_module(m)

          dig = m.Dig()
          fqdn = "brevo1._domainkey.skycreation.dev"
          dig.nameservers = dig.ns("skycreation.dev")
          print("nameservers:", dig.nameservers)

          print("raw TXT   :", dig.query(fqdn, "TXT"))
          print("txt()     :", [t[:40] for t in dig.txt(fqdn)])
          print("cname()   :", dig.cname(fqdn))

          records, target = m.follow_txt_chain(dig, fqdn)
          print("chain ->", target)
          print("found key:", bool([t for t in records if m.is_dkim_record(t)]))
          for t in records:
              print("  is_dkim:", m.is_dkim_record(t), "|", t[:50])

          print("--- full doctor on the authoritative path ---")
          doc = m.Doctor("skycreation.dev")
          m.check_dkim(doc, dig)
          print("check_dkim failed:", doc.failed)
          for f in doc.findings:
              print("  ", f.level, "|", f.detail[:90])

          print("--- raw dig against each authoritative server ---")
          import subprocess
          for ns in dig.nameservers:
              for rtype in ("TXT", "CNAME"):
                  out = subprocess.run(
                      ["dig", "+short", f"@{ns}", fqdn, rtype],
                      capture_output=True, text=True,
                  )
                  print(f"@{ns} {rtype}: {out.stdout.strip()[:160]!r}")
          PY