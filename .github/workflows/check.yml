name: Site checks

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "maintenance/**"
      - "infra/**"
      - "test/**"
      - "functions/**"
      - ".github/**"
      - "netlify.toml"
  pull_request:
    paths:
      - "site/**"
      - "maintenance/**"
      - "infra/**"
      - "test/**"
      - "functions/**"
      - ".github/**"
      - "netlify.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Syntax-check the JavaScript
        run: |
          set -euo pipefail
          for file in site/assets/*.js functions/*.mjs; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Test the contact form
        # The form has a history of telling visitors a message was sent when it
        # was not, so both halves are tested rather than eyeballed.
        run: |
          set -euo pipefail
          # Expanded by the shell rather than passed as a quoted glob, so this
          # does not depend on how the runner's Node handles glob patterns.
          node --test test/*.test.mjs

      - name: Test the DNS doctor parsers
        run: python3 -m unittest discover -s infra -v

      - name: Smoke-test the JSON report
        # --json used to die with a NameError on every run because asdict was
        # never imported, and the nightly job swallowed it. Assert the CLI
        # really emits parseable JSON. A missing dig is an environment problem
        # and is allowed to pass; a crash in our own code is not.
        run: |
          set -uo pipefail
          if ! command -v dig >/dev/null; then
            echo "dig unavailable on this runner, skipping JSON smoke test"
            exit 0
          fi
          # The doctor exits non-zero when it reports a finding, which is the
          # normal case for a domain that is not perfect. That is not what this
          # step is testing: it checks that the report is emitted as JSON at all.
          # dns-watch.yml is where failing DNS should turn a build red.
          python3 infra/dns_doctor.py --domain skycreation.dev --json > report.json || true
          set -e
          python3 - <<'PY'
          import json
          with open("report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          assert report["domain"] == "skycreation.dev", report
          assert isinstance(report["findings"], list), report
          print(f"report.json OK: {len(report['findings'])} findings")
          PY

      - name: Verify every internal link target exists
        # Handles both link styles in the repo: root-relative ("/about", which
        # Netlify resolves through pretty_urls) and page-relative
        # ("assets/styles.css"). Both site/ and maintenance/ are checked because
        # either can be the live publish root.
        run: |
          set -euo pipefail
          missing=0
          for page in site/*.html maintenance/*.html; do
            for href in $(grep -o 'href="[^"#][^"]*"' "$page" | sed 's/href="//; s/"$//'); do
              case "$href" in
                http*|mailto:*|tel:*|//*|"") continue ;;
              esac
              clean="${href%%#*}"
              clean="${clean%%\?*}"
              if [ "${clean:0:1}" = "/" ]; then
                # Root-relative: resolve against the publish directory.
                target="site$clean"
                candidates="$target $target.html $target/index.html"
              else
                target="$(dirname "$page")/$clean"
                candidates="$target"
              fi
              found=0
              for candidate in $candidates; do
                if [ -e "$candidate" ]; then
                  found=1
                  break
                fi
              done
              if [ "$found" -eq 0 ]; then
                echo "missing: $page -> $href"
                missing=1
              fi
            done
          done
          exit $missing

      - name: Check the founder page
        # The founder site is deployed separately, so nothing else in this
        # workflow looks at it. Externally hosted URLs (the Tailwind and Font
        # Awesome CDNs) are not fetched, same as everywhere else here; this only
        # asserts the file is present and its self-referential metadata is
        # correct, because those are what silently rot.
        run: |
          set -euo pipefail
          for required in site/founder/index.html site/founder/netlify.toml \
                          site/founder/robots.txt site/founder/sitemap.xml \
                          site/founder/images/profile-picture.jpg; do
            if [ ! -f "$required" ]; then
              echo "missing: $required"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json, re, sys

          html = open("site/founder/index.html", encoding="utf-8").read()

          # Canonical and og:url must agree on the founder host, or search
          # engines are told two different things about one page.
          canonical = re.search(r'<link rel="canonical" href="([^"]+)"', html)
          og_url = re.search(r'<meta property="og:url" content="([^"]+)"', html)
          for name, match in (("canonical", canonical), ("og:url", og_url)):
              if not match:
                  sys.exit(f"founder page has no {name}")
              if not match.group(1).startswith("https://founder.skycreation.dev"):
                  sys.exit(f"founder {name} points elsewhere: {match.group(1)}")

          # JSON-LD must parse, and schema.org wants a bare address: a
          # "mailto:" prefix in email was shipped once and is invalid.
          blocks = re.findall(
              r'<script type="application/ld\+json">(.*?)</script>', html, re.S
          )
          if not blocks:
              sys.exit("founder page has no JSON-LD")
          for block in blocks:
              data = json.loads(block)
              email = data.get("email")
              if email is not None and (email.startswith("mailto:") or "@" not in email):
                  sys.exit(f"JSON-LD email is not a bare address: {email!r}")

          # target="_blank" without rel="noopener" hands the opened page a
          # handle on window.opener.
          for tag in re.findall(r"<a\b[^>]*target=\"_blank\"[^>]*>", html):
              if "noopener" not in tag:
                  sys.exit(f"external link without noopener: {tag[:120]}")

          # A visible contact address must match the JSON-LD one, otherwise the
          # structured data advertises a mailbox nobody reads.
          mailtos = set(re.findall(r'href="mailto:([^"]+)"', html))
          ld_emails = set()
          for block in blocks:
              email = json.loads(block).get("email")
              if email:
                  ld_emails.add(email)
          if ld_emails - mailtos:
              sys.exit(f"JSON-LD email has no matching mailto link: {sorted(ld_emails - mailtos)}")

          print("founder page OK")
          PY
