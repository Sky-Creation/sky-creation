# Netlify config for the founder portfolio site (founder.skycreation.dev).
#
# Deploy by running from THIS directory, so this file is the one discovered:
#   cd site/founder
#   netlify deploy --dir=. --prod --site b851f1db-a2f0-4f67-81aa-6798f5296ab6
#
# netlify-cli has no --config flag, so running from the repo root cannot be
# made to use this file: it would read the root netlify.toml instead and bundle
# the company contact function and the /founder redirects onto this site.
# `--site` is equally required, because the CLI's local project link points at
# the company site.
#
# The Netlify project's Base directory can also be set to `site/founder` in the
# dashboard, which makes the same file authoritative for UI-side builds.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
