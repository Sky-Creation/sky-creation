# Netlify build configuration for skycreation.dev
# Free tier only. No build step - the site is hand-written HTML/CSS/JS.
#
# The finished site is published from site/. The "coming soon" page in
# maintenance/ is kept in the repository as an emergency fallback but is
# deliberately not published: switching publish to "maintenance" and deploying
# is the documented way to take the site down if it ever has to be.
#
# The founder portfolio lives at site/founder/ and is a separate Netlify site
# (founder.skycreation.dev). Deploy it from INSIDE its directory, so that
# site/founder/netlify.toml is the config that gets picked up:
#   cd site/founder
#   netlify deploy --dir=. --prod --site b851f1db-a2f0-4f67-81aa-6798f5296ab6
#
# Do not run this from the repo root. netlify-cli has no --config flag (it was
# documented here for a while and never existed), and running from the root
# reads THIS file: it would bundle functions/ onto the founder site and apply
# the /founder 301s below to the founder site itself.

[build]
  publish = "site"
  functions = "functions"

[build.environment]
  NODE_VERSION = "22"

# Pretty URLs: /about serves about.html. Extensionless form is canonical.
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true

# --- Contact form -> Netlify Function -> Brevo ---------------------------

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# --- Exchange app -> Netlify Function (public + admin) -------------------
# Both trees are handled by the one exchange function, which routes on the
# original request path. Order matters: /api/contact is declared above it.

[[redirects]]
  from = "/api/exchange/*"
  to = "/.netlify/functions/exchange"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/exchange"
  status = 200

# /app used to be a byte-for-byte duplicate of /exchange; the twin pages
# drifted whenever one was edited, so the duplicate is retired.
[[redirects]]
  from = "/app"
  to = "/exchange"
  status = 301

[[redirects]]
  from = "/calculator"
  to = "/exchange"
  status = 301

# Founder portfolio lives on its own subdomain; keep /founder as a bounce.
[[redirects]]
  from = "/founder"
  to = "https://founder.skycreation.dev/"
  status = 301
  force = true

[[redirects]]
  from = "/founder/*"
  to = "https://founder.skycreation.dev/:splat"
  status = 301
  force = true

# --- Headers --------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-DNS-Prefetch-Control = "off"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; script-src 'self'; img-src 'self' data: https:;"

# Fingerprinted assets are not fingerprinted, so keep caching conservative.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# HTML should always revalidate so a deploy is visible immediately.
# Cover both extensionless pretty URLs and raw .html paths.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/about"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/work"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/math"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/exchange"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/orders"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/contact"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/founder"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/founder/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Belt and suspenders: these directories live at the repo root and are never
# published, but if anyone moves them back under site/ these rules refuse to
# serve them. The target is site/404.html, the site's real 404 page.
[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true
