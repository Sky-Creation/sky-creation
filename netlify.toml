# Netlify build configuration for skycreation.dev
# Free tier only. No build step - the site is hand-written HTML/CSS/JS.
#
# While the full site is still being finished, only the "coming soon" page in
# maintenance/ is published. The contact function in site/functions is still
# deployed so the mail path is live and testable, and every other address
# redirects to the founder's portfolio.
#
# To publish the finished site instead, change publish below to "site" and
# delete the redirect block.
#
#   publish = "maintenance"   <- what is live now
#   publish = "site"          <- the finished site

[build]
  publish = "maintenance"
  functions = "site/functions"

[build.environment]
  NODE_VERSION = "22"

# --- Contact form -> Netlify Function -> Brevo ---------------------------
# Kept live while the rest of the site waits. The maintenance page has no
# form, but the endpoint stays reachable and correctly configured.

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# --- Everything else goes to the founder's portfolio ----------------------
# Netlify serves files in the publish directory before applying redirects, so
# these cover the addresses the finished site will eventually use.

[[redirects]]
  from = "/about"
  to = "https://founder.skycreation.dev"
  status = 302

[[redirects]]
  from = "/work"
  to = "https://founder.skycreation.dev"
  status = 302

[[redirects]]
  from = "/math"
  to = "https://founder.skycreation.dev"
  status = 302

[[redirects]]
  from = "/contact"
  to = "https://founder.skycreation.dev"
  status = 302

[[redirects]]
  from = "/about.html"
  to = "https://founder.skycreation.dev"
  status = 302

[[redirects]]
  from = "/work.html"
  to = "https://founder.skycreation.dev"
  status = 302

[[redirects]]
  from = "/math.html"
  to = "https://founder.skycreation.dev"
  status = 302

[[redirects]]
  from = "/contact.html"
  to = "https://founder.skycreation.dev"
  status = 302

# --- Headers --------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Fingerprinted assets are not fingerprinted, so keep caching conservative.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# HTML should always revalidate so a deploy is visible immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
